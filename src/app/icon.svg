<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    FAVICON — el símbolo de CST, el mismo de src/components/Logo.tsx y de
    Marketing/cst/logo/svg/cst-favicon.svg.

    Va sobre un cuadro azul que el logo grande no tiene. Un favicon vive en
    una pestaña que puede ser clara u oscura según el tema del navegador; el
    cuadro le garantiza su propio fondo siempre, y en blanco el trazo se lee
    en los dos casos.

    Si cambias el símbolo, cámbialo también en Logo.tsx, en src/lib/og.tsx y
    en Marketing/cst/logo/.
  -->
  <rect width="64" height="64" rx="14" fill="#2F5BFF"/>
  <g transform="translate(7.27 7.27) scale(1.03)">
    <path d="M25 7H16a9 9 0 0 0-9 9v16a9 9 0 0 0 9 9h16a9 9 0 0 0 9-9V23" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38.364" cy="9.636" r="5.5" fill="#FFC21A"/>
  </g>
</svg>
